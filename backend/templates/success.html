<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Order Successful | SMD Styles & Fashions</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>
    <div class="loader" id="loader">
      <div class="loader-spinner"></div>

      <h1>SMD</h1>

      <p>Styles & Fashions</p>
    </div>

    <section class="checkout-page">
      <div class="checkout-container">
        <div
          class="checkout-left"
          style="text-align: center; grid-column: 1/-1"
        >
          <h1 style="color: #d4af37; font-size: 60px">✅</h1>

          <h2>Order Placed Successfully</h2>

          <p>
            Thank you for shopping with

            <strong>SMD Styles & Fashions</strong>
          </p>

          <br />

          <h3 id="orderNumber"></h3>

          <br />

          <button class="buy-btn" onclick="window.location.href = '/'">
            Continue Shopping
          </button>
        </div>
      </div>
    </section>

    <script>
      const orderNumber = sessionStorage.getItem("lastOrderNumber");

      const orderNumberElement = document.getElementById("orderNumber");

      if (orderNumber) {
        orderNumberElement.textContent = "Order ID : " + orderNumber;

        sessionStorage.removeItem("lastOrderNumber");
      } else {
        orderNumberElement.textContent = "Order details unavailable";
      }
    </script>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
