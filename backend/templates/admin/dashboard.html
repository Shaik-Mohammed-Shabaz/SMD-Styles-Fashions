<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Dashboard | SMD Styles & Fashions</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <style>
      body {
        background: #080808;
        color: white;
        font-family: Poppins, sans-serif;
        margin: 0;
      }

      .admin-container {
        max-width: 1200px;
        margin: auto;
        padding: 40px 20px;
      }

      .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
      }

      .admin-header h1 {
        color: var(--secondary-color);
        margin: 0;
      }

      .admin-header p {
        color: #aaa;
        margin-top: 8px;
      }

      .logout-btn {
        color: white;
        text-decoration: none;
        border: 1px solid #d32f2f;
        padding: 10px 18px;
        border-radius: 5px;
      }

      .logout-btn:hover {
        background: #d32f2f;
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 40px;
      }

      .dashboard-card {
        background: #111;
        border: 1px solid #333;
        border-top: 3px solid var(--secondary-color);
        padding: 25px;
        border-radius: 8px;
      }

      .dashboard-card h3 {
        color: #aaa;
        font-size: 15px;
        margin-bottom: 10px;
      }

      .dashboard-card .number {
        font-size: 32px;
        font-weight: 600;
        color: var(--secondary-color);
      }

      .admin-actions {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }

      .admin-action {
        display: block;
        background: #111;
        border: 1px solid #333;
        padding: 25px;
        border-radius: 8px;
        text-decoration: none;
        color: white;
        transition: 0.3s;
      }

      .admin-action:hover {
        border-color: var(--secondary-color);
        transform: translateY(-3px);
      }

      .admin-action h2 {
        color: var(--secondary-color);
        margin-top: 0;
      }

      .admin-action p {
        color: #aaa;
      }

      @media (max-width: 700px) {
        .dashboard-grid {
          grid-template-columns: 1fr;
        }

        .admin-actions {
          grid-template-columns: 1fr;
        }

        .admin-header {
          flex-direction: column;
          align-items: flex-start;
          gap: 20px;
        }
      }
    </style>
  </head>

  <body>
    <div class="admin-container">
      <div class="admin-header">
        <div>
          <h1>Admin Dashboard</h1>

          <p>Welcome to SMD Styles & Fashions administration.</p>
        </div>

        <a href="{{ url_for('main.admin_logout') }}" class="logout-btn">
          Logout
        </a>
      </div>

      <!-- Dashboard Statistics -->

      <div class="dashboard-grid">
        <div class="dashboard-card">
          <h3>Customer Messages</h3>

          <div class="number">{{ message_count }}</div>
        </div>

        <a
          href="{{ url_for('main.admin_products') }}"
          class="dashboard-card"
          style="text-decoration: none; display: block"
        >
          <h3>Products</h3>

          <div class="number">{{ product_count }}</div>

          <p style="color: #aaa; margin-top: 10px">Manage Products →</p>
        </a>

        <div class="dashboard-card">
          <h3>Orders</h3>

          <div class="number">0</div>
        </div>
      </div>

      <!-- Admin Actions -->

      <div class="admin-actions">
        <a href="{{ url_for('main.admin_messages') }}" class="admin-action">
          <h2>📩 Customer Messages</h2>

          <p>View messages submitted through the Contact Us form.</p>
        </a>

        <a href="{{ url_for('main.shop') }}" class="admin-action">
          <h2>🛍️ View Store</h2>

          <p>Open the customer-facing store.</p>
        </a>
      </div>
    </div>
  </body>
</html>
