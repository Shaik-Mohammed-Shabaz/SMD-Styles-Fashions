<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Edit Product | SMD Styles & Fashions</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />

    <style>
      body {
        background: #080808;
        color: white;
        font-family: Poppins, sans-serif;
        margin: 0;
      }

      .admin-container {
        max-width: 800px;
        margin: auto;
        padding: 40px 20px;
      }

      .admin-header {
        margin-bottom: 30px;
      }

      .admin-header h1 {
        color: var(--secondary-color);
        margin: 0;
      }

      .admin-header p {
        color: #aaa;
        margin-top: 8px;
      }

      .product-form {
        background: #111;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 30px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #ddd;
        font-weight: 600;
      }

      .form-group input,
      .form-group textarea,
      .form-group select {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        background: #080808;
        color: white;
        border: 1px solid #444;
        border-radius: 5px;
        font-family: inherit;
      }

      .form-group textarea {
        min-height: 120px;
        resize: vertical;
      }

      .form-group input:focus,
      .form-group textarea:focus,
      .form-group select:focus {
        outline: none;
        border-color: #d4af37;
      }

      .featured-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .featured-group input {
        width: auto;
      }

      .form-actions {
        display: flex;
        gap: 12px;
        margin-top: 25px;
      }

      .admin-btn {
        display: inline-block;
        padding: 11px 20px;
        border-radius: 5px;
        text-decoration: none;
        color: white;
        border: 1px solid #333;
        background: #181818;
        cursor: pointer;
        font-family: inherit;
      }

      .admin-btn:hover {
        border-color: #d4af37;
        color: #d4af37;
      }

      .update-btn {
        background: #d4af37;
        color: #000;
        border-color: #d4af37;
        font-weight: 600;
      }

      .update-btn:hover {
        background: transparent;
        color: #d4af37;
      }

      .current-image {
        margin-top: 10px;
        color: #aaa;
        font-size: 14px;
      }

      @media (max-width: 600px) {
        .product-form {
          padding: 20px;
        }

        .form-actions {
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <div class="admin-container">

      <div class="admin-header">
        <h1>Edit Product</h1>

        <p>Update the product information below.</p>
      </div>

      <form
        method="POST"
        action="{{ url_for('main.admin_edit_product', product_id=product.id) }}"
        class="product-form"
      >

        <div class="form-group">
          <label for="name">Product Name</label>

          <input
            type="text"
            id="name"
            name="name"
            value="{{ product.name }}"
            required
          />
        </div>

        <div class="form-group">
          <label for="description">Description</label>

          <textarea
            id="description"
            name="description"
            required
          >{{ product.description }}</textarea>
        </div>

        <div class="form-group">
          <label for="price">Price (₹)</label>

          <input
            type="number"
            id="price"
            name="price"
            value="{{ product.price }}"
            min="0"
            step="0.01"
            required
          />
        </div>

        <div class="form-group">
          <label for="category">Category</label>

          <select id="category" name="category" required>

            <option value="shirt" {% if product.category == "shirt" %}selected{% endif %}>
              Shirt
            </option>

            <option value="tshirt" {% if product.category == "tshirt" %}selected{% endif %}>
              T-Shirt
            </option>

            <option value="hoodie" {% if product.category == "hoodie" %}selected{% endif %}>
              Hoodie
            </option>

            <option value="jeans" {% if product.category == "jeans" %}selected{% endif %}>
              Jeans
            </option>

            <option value="trousers" {% if product.category == "trousers" %}selected{% endif %}>
              Trousers
            </option>

            <option value="jacket" {% if product.category == "jacket" %}selected{% endif %}>
              Jacket
            </option>

          </select>
        </div>

        <div class="form-group">
          <label for="stock">Stock</label>

          <input
            type="number"
            id="stock"
            name="stock"
            value="{{ product.stock }}"
            min="0"
            required
          />
        </div>

        <div class="form-group">
          <label for="image">Image Path</label>

          <input
            type="text"
            id="image"
            name="image"
            value="{{ product.image }}"
            required
          />

          <div class="current-image">
            Current image: {{ product.image }}
          </div>
        </div>

        <div class="form-group featured-group">
          <input
            type="checkbox"
            id="is_featured"
            name="is_featured"
            {% if product.is_featured %}checked{% endif %}
          />

          <label for="is_featured">Featured Product</label>
        </div>

        <div class="form-actions">

          <a
            href="{{ url_for('main.admin_products') }}"
            class="admin-btn"
          >
            ← Cancel
          </a>

          <button
            type="submit"
            class="admin-btn update-btn"
          >
            Update Product
          </button>

        </div>

      </form>
    </div>
  </body>
</html>
