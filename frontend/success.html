<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Successful | SMD Styles & Fashions</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="loader" id="loader">

        <div class="loader-spinner"></div>

        <h1>SMD</h1>

        <p>Styles & Fashions</p>

    </div>

    <section class="checkout-page">

        <div class="checkout-container">

            <div class="checkout-left" style="text-align:center;grid-column:1/-1;">

                <h1 style="color:#D4AF37;font-size:60px;">
                    ✅
                </h1>

                <h2>Order Placed Successfully</h2>

                <p>

                    Thank you for shopping with

                    <strong>SMD Styles & Fashions</strong>

                </p>

                <br>

                <h3 id="orderNumber"></h3>

                <br>

                <button class="buy-btn" onclick="window.location.href='index.html'">

                    Continue Shopping

                </button>

            </div>

        </div>

    </section>

    <script>

        const orderID =
            "SMD" + Math.floor(Math.random() * 1000000);

        document.getElementById("orderNumber").textContent =
            "Order ID : " + orderID;

    </script>

</body>

</html>
